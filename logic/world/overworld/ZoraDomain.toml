# ZoraDomain

[regions.Root.exits]
"ZoraDomain" = "((is_adult or Deku_Tree_Clear or has_bombs) and (can_play(Zeldas_Lullaby) or can_dive)) or (can_dive and can_play(Zeldas_Lullaby))"

[regions."ZoraDomain"]

[regions."ZoraDomain".locations]
"ZoraDomain Static room 0 #0 (Obj_Heart_Piece)" = "is_child and Deku_Sticks"
"MiniGame_Diving: Item_Scale_Silver (npc item)" = "is_child"

[regions."ZoraDomain".skulltulas]
"ZD GS Frozen Waterfall" = "is_adult and Hookshot"  # original: is_adult and at_night and (Hookshot or Bow or Magic_Meter or logic_domain_gs)

# Zora Shop (shopsanity). As adult the shopkeeper is frozen until King Zora is thawed with blue
# fire, which this logic does not model, so only the child shop counts.
[regions."ZoraDomain".exits]
"ZoraShop" = "is_child or (is_adult and Ice_Cavern_Clear)"

[regions."ZoraShop".locations]
"Zora Shop Slot 0" = "true"  # vanilla: Red Potion
"Zora Shop Slot 1" = "true"  # vanilla: Green Potion
"Zora Shop Slot 2" = "true"  # vanilla: Bug
"Zora Shop Slot 3" = "true"  # vanilla: Shop_Armor_Zora
"Zora Shop Slot 4" = "true"  # vanilla: Arrow_Bundle
"Zora Shop Slot 5" = "true"  # vanilla: Arrow_Bundle
"Zora Shop Slot 6" = "true"  # vanilla: Fish
"Zora Shop Slot 7" = "true"  # vanilla: Arrow_Bundle
