# GoronCity

[regions."GoronCity"]

[regions."GoronCity".exits]
"DeathMountainTrail" = "true"
"GoronShop" = "has_explosives or has_strength or (is_adult and Bow) or (can_play(Zeldas_Lullaby) and Sticks) or Dins_Fire"
"LostWood" = "has_explosives or (can_play(Zeldas_Lullaby) and Sticks)"
"DeathMountainCraterInner" = "is_adult and Silver_Gauntlets"

[regions."GoronCity".locations]
"GoronCity Dynamic room 0 #0 (TBox_Rupee_Blue)" = "has_explosives"
"GoronCity Dynamic room 0 #0 (TBox_Rupee_Purple)" = "is_adult and Silver_Gauntlets"
"GoronCity Dynamic room 0 #0 (TBox_Rupee_Red)" = "is_adult and Megaton_Hammer"
"GoronCity Dynamic room 0 #1 (TBox_Rupee_Blue)" = "has_explosives"
"GoronCity Static room 0 #0 (TBox_Rupee_Green)" = "is_adult and has_hookshot"
"GoronCity Static room 0 #0 (TBox_Rupee_Purple)" = "is_adult and has_hookshot"
"Dm_Goron_0030: Item_Gauntlet_Goron (npc item)" = "is_child and can_play(Zeldas_Lullaby) and can_play(Sarias_Song)"
"Npc_Goron_006_Child: Item_BombBag_Medium (npc item)" = "is_child and Bomb_Bag"

[regions."GoronCity".skulltulas]
"GC GS Boulder Maze" = "has_explosives"  # original: is_child and has_explosives
"GC GS Center Platform" = "is_adult and has_hookshot"  # original: is_adult

# Goron Shop (shopsanity). Opening it: child with explosives or strength, adult by stopping
# the rolling Goron (explosives, strength or bow); OoT Randomizer's 'GC Shop' rule without Din's Fire.

[regions."GoronShop".locations]
"Goron Shop Slot 0" = "has_bombs"  # vanilla: Shop_Heart
"Goron Shop Slot 1" = "has_bombs"  # vanilla: Shop_Bottle_RedPotion
"Goron Shop Slot 2" = "has_bombs"  # vanilla: Shop_Bottle_Bug
"Goron Shop Slot 3" = "has_bombs and Item_Wallet_Large"  # vanilla: Shop_Armor_Goron
"Goron Shop Slot 4" = "has_bombs"  # vanilla: Shop_BombBundle_01
"Goron Shop Slot 5" = "has_bombs"  # vanilla: Shop_BombBundle_02
"Goron Shop Slot 6" = "has_bombs"  # vanilla: Shop_BombBundle_03
"Goron Shop Slot 7" = "has_bombs"  # vanilla: Shop_BombBundle_04
