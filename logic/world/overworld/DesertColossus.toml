# DesertColossus


[regions."DesertColossus"]

[regions."DesertColossus".exits]
"HountedWasteland" = "true"
"SpiritTemple" = "true"

[regions."DesertColossus".locations]
"DesertColossus Heart Piece 1" = "is_adult"  # loose Obj_Heart_Piece, both ages
"Dm_MelodyGet_Spilit" = "is_adult"  # song: Requiem of Spirit from Sheik, Desert Colossus
"DesertColossus Static room 0 #0 (Item_Gauntlet_Silver)" = "is_child and has_explosives and (Boomerang or Slingshot)"
"DesertColossus Static room 0 #0 (Item_Shield_Mirror)" = "is_adult and (Silver_Gauntlets or Golden_Gauntlets) and has_explosives"
"DesertColossus Static room 0 #0 (TBox_Rupee_Purple)" = "true"
"Dm_FairyFountain_Nayru: Item_NayruLove (npc item)" = "(has_explosives or (Megaton_Hammer and is_adult)) and (Item_Wallet_Medium or Item_Wallet_Large) and can_play(Zeldas_Lullaby)"  # Great Fairies only spawn once Zelda's Lullaby is owned

[regions."DesertColossus".skulltulas]
"Colossus GS Bean Patch" = "is_child"  # original: can_plant_bugs and can_child_attack
"Colossus GS Tree" = "(is_adult and has_hookshot)"  # original: can_use(Hookshot) and at_night
"Colossus GS Hill" = "is_adult"  # original: is_adult and at_night and (here(can_plant_bean) or Longshot or (logic_colossus_gs and Hookshot))
