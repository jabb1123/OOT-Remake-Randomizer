# HyruleCastle

[regions.Root.exits]
"HyruleCastle" = "is_child and Deku_Tree_Clear"

[regions."HyruleCastle"]

[regions."HyruleCastle".events]
"Zeldas_Letter" = "true"  # Zelda gives the letter in the castle; not randomized, gates the Kakariko/Death Mountain route for children

[regions."HyruleCastle".locations]
"Dm_MelodyGet_Zelda" = "is_child"  # song: Zelda's Lullaby from Impa, Hyrule Castle courtyard

[regions."HyruleCastle".skulltulas]
"HC GS Tree" = "is_child"  # original: can_child_attack and can_bonk
"HC GS Storms Grotto" = "is_child and can_play(Song_of_Storms) and Stone_of_Agony and has_explosives and Boomerang"  # original: (can_blast_or_smash or (is_child and logic_castle_storms_gs)) and (can_use(Boomerang) or can_use(Hookshot))
