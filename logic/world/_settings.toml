# Ocarina of Time remake world logic.
#
# The logic is split into one file per area:
#   _settings.toml          [settings] only (this file)
#   _helpers.toml           [helpers]: shared requirement groups (has_bombs, can_play(song), ...)
#   overworld/<Region>.toml overworld areas
#   dungeons/<Region>.toml  regions marked dungeon = true
# Every *.toml under logic/world/ is loaded recursively in sorted path order and deep-merged:
#   * [settings] may appear in only one file.
#   * [helpers] may be split across files, but each helper name is defined once.
#   * Top-level [exits] may be split across files; each target is defined once.
#   * Per region, the exits / locations / events / skulltulas tables are merged across files;
#     the same key defined in two files is an error that names both files.
#   * Scalar flags (dungeon, excluded) may be repeated but must agree.
# Each area file is self-contained: it adds its own entry to [regions.Root.exits] (how you get
# there from the spawn) and then lists [regions."<Region>"] flags, events, locations and skulltulas.
# A single TOML file holding everything (e.g. from `oot-randomizer logic template`) also loads.
#
# Each region lists:
#   [regions.X.exits]      other regions you can walk to, and what that takes
#   [regions.X.locations]  chests / song spots in the region, and what opening them takes
#   [regions.X.skulltulas] Gold Skulltulas in the region (always hold a token) and what reaching them takes
#   [regions.X.events]     story milestones (boss beaten, door opened) other rules can require
#   dungeon = true         counts for "one major item per dungeon"
#   excluded = true        chests here keep their vanilla item
# The top-level [exits] table lists regions reachable from anywhere (e.g. warp songs), with the
# requirement to get there.
#
# Requirements use item names joined by `and` / `or` with parentheses, e.g.
#   "Hookshot and (Bow or Slingshot)".  Also available: is_child, is_adult, true, false,
#   event names, `Item:N` for counts, and the option bombchus_in_logic.
# Items accept friendly names (Hookshot, Bow, Zeldas_Lullaby) or actor names (Item_Range_Bow).
# Helpers from _helpers.toml work like names, and some take arguments:
#   "has_explosives and can_play(Song_of_Storms)"
# Use can_play(<song>) whenever a song is played; a bare song name only means "learned".
#
# Starter rules are simplified vanilla Ocarina of Time requirements; refine as needed.
# Locations left as "true" only need their region to be reachable.
#
# Gold Skulltula rules are translated from the N64 OoT Randomizer (non-MQ) logic; each keeps
# the original rule as a trailing `# original: ...` comment. They assume: tricks off, closed
# forest, no ER, keys/silver rupees ignored; sticks/nuts/magic/bottles/beans/scale/tunics/
# scarecrow song/time of day always available.

[settings]
start_age = "child"
child_spawn = "Root"
adult_spawn = "Root"
# Event that unlocks playing as the other age (Door of Time / Master Sword).
time_travel = "Time_Travel"
goal = "Ganon_Defeated"
start_items = []
