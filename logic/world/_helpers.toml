# Shared requirement groups ("helpers") used by the area files.
#
# A helper is a named requirement. Use it anywhere an item or event name can go:
#   "SomeChest" = "is_child and has_explosives"
# Helpers can take arguments, written `name(param, ...)`; the argument replaces the parameter:
#   "SomeChest" = "can_play(Song_of_Storms)"   # = has_ocarina and Song_of_Storms
# Helpers may use other helpers. They may be added in any logic file under [helpers], but each
# name must be defined once and cannot reuse an item, event or option name.

[helpers]
# --- Ocarina and songs -------------------------------------------------------------------
# Learning a song needs no ocarina; playing one does. Use can_play(...) wherever a song is used.
has_ocarina = "Fairy_Ocarina or Ocarina_of_Time"
"can_play(song)" = "has_ocarina and song"

# --- Complex Logic Checks -------------------------------------------------------------------
has_adult = "can_play(Song_of_Time) and Kokiris_Emerald and Goron_Ruby and Zora_Sapphire"
moving_time = "is_child and Alarm_Cucco"

# --- Strength and explosives -------------------------------------------------------------
# The Goron Bracelet event carries over to both ages.
has_strength = "Goron_Bracelet or (Silver_Gauntlets or Golden_Gauntlets)"
# Picking up and throwing bombs (bomb bag bombs or bomb flowers) needs strength.
has_bombs = "Bomb_Bag and has_strength"
# Bombchus are set down, not lifted, so they only need the Bomb Bag.
has_bombchus = "bombchus_in_logic and Bomb_Bag and Bombchus"
has_explosives = "has_bombs or has_bombchus"
can_blast_or_smash = "has_explosives or (is_adult and Megaton_Hammer)"

# --- Weapons and tools -------------------------------------------------------------------
has_weapon = "((has_hookshot or Megaton_Hammer) and is_adult) or (is_child and Slingshot) or (is_child and Kokiri_Sword)"
has_hookshot = "is_adult and (Hookshot or Longshot)"
# Slingshot or Boomerang (child) or Bow (adult): eye switches, targets and other projectile checks.
can_shoot = "(is_child and (Slingshot or Boomerang)) or (is_adult and Bow)"
# Any ranged attack for the current age, boomerang and hookshot included.
ranged_weapon = "(is_child and (Slingshot or Boomerang)) or (is_adult and (Bow or has_hookshot))"

# --- Swimming -------------------------------------------------------------------------
can_dive = "Item_Scale_Silver or Item_Scale_Gold"

can_get_to_hyrule_field = "Deku_Tree_Clear and has_explosives"

