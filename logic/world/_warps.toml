"DesertColossus" = "can_play(Requiem_of_Spirit) and (is_adult or can_play(Item_Melody_ForestMinuet) or can_play(Item_Melody_WaterSerenade) or can_play(Nocturne_of_Shadow) or can_play(Item_Melody_LightPrelude))"  # a child needs a warp other than Requiem to leave the Crater
"TempleOfTime" = "can_play(Item_Melody_LightPrelude)"
