# SpiritTemple
# Each room is a sub-region. `dungeon = "SpiritTemple"` gives all of them one key counter.
# Exits follow the original OoT region graph. Shortcut-gated edges are dropped for now.

[regions."SpiritTemple"]
dungeon = "SpiritTemple"

[regions."SpiritTemple".exits]
"DesertColossus" = "true"
"SpiritTempleChildDoor" = "is_child"
"SpiritTempleEarlyAdult" = "is_adult and (Silver_Gauntlets or Golden_Gauntlets)"

