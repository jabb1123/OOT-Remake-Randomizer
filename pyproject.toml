[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oot-randomizer"
version = "0.1.0"
description = "Python foundation for an Ocarina of Time randomizer that consumes .nup ROM files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "zstandard>=0.22.0",
    "evfl>=1.3.0",
]

[project.scripts]
oot-randomizer = "oot_randomizer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
